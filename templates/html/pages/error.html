{{ template "layout/base" . }}
{{ define "content" }}
    <section class="hero">
      <span class="hero-icon icon-error" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.4 3.5 18.4a1.5 1.5 0 0 0 1.3 2.2h14.4A1.5 1.5 0 0 0 20.5 18.4z"/><path d="M12 9.4v4"/><path d="M12 16.9h.01"/></svg></span>
      <h1>{{.Title}}</h1>
      <p class="subtitle" role="alert">{{.Message}}</p>
      {{ if .RetryURL }}
      <p class="hint">点击“重试”将重新发起登录；若问题持续，请稍后再试。</p>
      {{ else }}
      <p class="hint">你可以关闭此页面，然后重新发起连接。</p>
      {{ end }}
    </section>
    {{ if .RetryURL }}
    <form method="post" action="{{.RetryURL}}" class="actions">
      <input type="hidden" name="csrf_token" value="{{.CSRF}}">
      <button name="action" value="login">重试</button>
    </form>
    {{ end }}
{{ end }}
